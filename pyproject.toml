[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mia"
version = "0.1.0"
description = "mIA · asistente conversacional de RRHH de Sunset Beach Club"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.32,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "structlog>=24.4",
    "tzdata>=2024.1",
    "msal>=1.30,<2",
    "cryptography>=43",
    "numpy>=1.26",
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4",
    "python-pptx>=1",
    "pypdfium2>=4",
    "pillow>=10",
]

[project.scripts]
mia = "mia.__main__:main"

[project.optional-dependencies]
azure = [
    "azure-monitor-opentelemetry>=1.6",
]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "SLF001", "ASYNC240", "E501"]
"tools/**" = ["S608", "T201"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mia"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.*", "msal.*", "docx.*", "openpyxl.*", "reportlab.*", "pptx.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mia.modules.rrhh.informes.render"]
disallow_untyped_calls = false
