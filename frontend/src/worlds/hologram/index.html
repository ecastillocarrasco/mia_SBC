<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>mIA · Holograma</title>
  <link rel="icon" href="../../../favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a class="back-link" href="../../../index.html">← mIA</a>
  <div id="canvas-root" class="projection"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="hud">
    <button id="miaWelcomeReplay" class="mia45-hg-replay" type="button" hidden>▶ Escuchar saludo</button>
    <p id="caption" class="caption" aria-live="polite">Cargando la proyección…</p>
    <div id="result" class="result"></div>
    <span id="hgMicModeAnnounce" class="hg-visually-hidden" aria-live="polite">Micrófono desactivado</span>
    <form id="composer" class="composer">
      <input id="input" type="text" placeholder="Pregunta a Mía…" autocomplete="off" />
      <button type="button" id="mic" class="mic" title="Micrófono desactivado · Pulsar para una pregunta"
        aria-label="Activar micrófono" aria-pressed="false">🎤</button>
      <button type="submit" id="send">↵</button>
    </form>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
