<!doctype html>
<html lang="es">
<head>
<!-- mIA V5.3.1: bloqueo de primera pintura antes del mundo 2D -->
<style id="mia2d-entry-paint-guard">
html.mia2d-entry-loading body::before,
html.mia2d-entry-loading body::after {
  position:fixed!important; z-index:2147483640!important; pointer-events:auto!important;
  box-sizing:border-box!important;
}
html.mia2d-entry-loading body::before {
  content:""; inset:0; background:linear-gradient(145deg,#fffbf5,#f9ece2 55%,#eee0d3);
}
html.mia2d-entry-loading body::after {
  content:"mIA\A SUNSET BEACH CLUB\A Preparando tu experiencia 2D";
  left:50%;top:50%;width:min(85vw,420px);transform:translate(-50%,-50%);
  text-align:center;white-space:pre-line;color:#6b3141;line-height:2.0;
  font:700 clamp(15px,2.5vw,23px)/1.9 Aptos,"Segoe UI",sans-serif;
  letter-spacing:.06em;
}
</style>
<script>
document.documentElement.classList.add('mia2d-entry-loading');
window.__mia2dEntryGuardTimeout=window.setTimeout(function(){
  document.documentElement.classList.remove('mia2d-entry-loading');
},18000);
</script>
<script type="module" src="./mia-entry-v530.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>mIA · Mundo 2D</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/index.html">
        <span class="brandmark">mIA</span>
        <div>
          <h1>Sunset Beach Club</h1>
          <p>Mundo 2D</p>
        </div>
      </a>
      <div class="top-right">
        <span class="status"><span class="dot"></span> <span id="statusLabel">Conectando…</span></span>
        <button id="voiceToggle" class="icon-toggle" type="button" title="Silenciar/activar la voz">🔊</button>
      </div>
    </header>

    <main class="grid">
      <section class="card avatar-card">
        <div class="avatar-wrap">
          <img id="avatarImg" src="/assets/avatar/reposo.png" alt="mIA" />
        </div>
        <p class="avatar-label" id="avatarLabel">Estoy aquí</p>
      </section>

      <section class="card conversation-card">
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <form id="composer" class="composer">
          <div id="attachmentPreviews" class="attachment-previews" style="display:none"></div>
          <div class="composer-row">
            <button type="button" id="attachBtn" class="attach-btn" title="Adjuntar archivo">📎</button>
            <input id="fileInput" type="file" multiple accept=".pdf,.docx,.txt,.md,.xlsx,.xls,.csv,.png,.jpg,.jpeg,.webp" style="display:none" />
            <input id="input" type="text" placeholder="Pregúntale algo a mIA…" autocomplete="off" />
            <button type="button" id="mic" class="mic" title="Hablar con mIA">🎤</button>
            <button type="submit" id="send">Enviar</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
  
</body>
</html>
