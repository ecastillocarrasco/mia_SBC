<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>mIA · Mundo 3D</title>
  <link rel="icon" href="../../../favicon.svg" />
  <link rel="stylesheet" href="./style.css?v=3d-v16.5-e360x" />
  <link rel="stylesheet" href="./v4-white.css?v=4.7" />
  <link rel="stylesheet" href="./holographic-results-v1.css?v=breakout-v3" />
</head>
<body>
  <a class="back-link" href="../../../index.html" aria-label="Volver al selector de mundos" title="Volver">
    <span aria-hidden="true">←</span><b>mIA</b>
  </a>
  <div id="canvas-root"></div>
  <div id="miaSpokenCaption" class="mia-voice-caption mia-narrative"
    aria-live="polite" aria-atomic="true" aria-label="Mensaje de Mía"></div>

  <!-- Small, separate progress HUD: no result panel for plain conversation. -->
  <div id="miaWaitProgress" class="mia-wait-progress" role="status" aria-live="polite" hidden>
    <span class="mia-wait-pulse" aria-hidden="true"></span>
    <span id="miaWaitText"></span>
  </div>

  <!-- Results only. Hidden entirely when no structured data accompanies an answer. -->
  <aside id="panel" class="panel" data-presentation="conversation" aria-label="Resultados de mIA">
    <header class="panel-head">
      <strong class="mia-results-brand">mIA · Sunset Beach Club</strong>
      <button type="button" id="closeResults" class="mia-panel-close" aria-label="Cerrar resultados" title="Cerrar resultados">×</button>
    </header>
    <div id="conversation" class="conversation" aria-live="polite"></div>
  </aside>

  <!-- Microfono OPT-IN: apagado -> una consulta -> continuo -> apagado. -->
  <span id="miaMicModeAnnounce" class="mia-visually-hidden" aria-live="polite">Micrófono desactivado</span>
  <button id="miaTextLauncher" class="mia-text-launcher" type="button"
    aria-label="Escribir consulta a Mía" aria-expanded="false" title="Escribir a Mía">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 18.5V20h1.5l10.9-10.9-1.5-1.5L4 18.5zm14.8-12.7a1.1 1.1 0 0 0 0-1.6l-1-1a1.1 1.1 0 0 0-1.6 0l-1.1 1.1 2.6 2.6 1.1-1.1zM3 21h18v-1H3z"/>
    </svg>
  </button>
  <button id="miaMicLauncher" class="mia-mic-launcher" type="button"
    aria-label="Activar micrófono para dictar" aria-pressed="false"
    title="Micrófono desactivado · Pulsar para una pregunta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21H8v2h8v-2h-3v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <section id="miaInteractionDock" class="mia-interaction-dock" aria-label="Consulta a mIA" hidden>
    <div class="mia-dock-head">
      <span class="mia-dock-status"><span class="dot"></span><span id="statusLabel">Lista para ayudarte</span></span>
      <div class="mia-dock-actions">
        <button id="voiceToggle" class="icon-toggle" type="button" title="Activar o silenciar voz de Mía" aria-label="Activar o silenciar voz de Mía" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.3 3a4.3 4.3 0 0 0-2-3.6v7.2a4.3 4.3 0 0 0 2-3.6zm0-7.4v2.1a9 9 0 0 0 0-14.8z"/></svg>
        </button>
        <button id="miaDockClose" type="button" aria-label="Ocultar barra de chat" title="Ocultar">×</button>
      </div>
    </div>
    <form id="composer" class="composer">
      <button type="button" id="mic" class="icon-button mic" title="Dictar consulta (pulsar para activar)"
        aria-label="Activar micrófono" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21H8v2h8v-2h-3v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="composer-field"><input id="input" type="text" placeholder="Pregunta a mIA…" autocomplete="off" /></div>
      <button type="submit" id="send" class="icon-button send" title="Enviar consulta" aria-label="Enviar consulta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 3.4 21 11.1a1 1 0 0 1 0 1.8L4.2 20.6a1 1 0 0 1-1.4-1.1l1.4-5.3 9.1-2.2-9.1-2.2-1.4-5.3a1 1 0 0 1 1.4-1.1z"/></svg>
      </button>
    </form>
  </section>

  <script type="module" src="./main.js?v=4.7-audio-sin-boton"></script>
</body>
</html>
