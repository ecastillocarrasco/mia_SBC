name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools migrations
      - run: ruff format --check src tests tools migrations
      - run: mypy
      - run: pytest --cov=mia --cov-report=term-missing

  postgres:
    # PostgreSQL aplica restricciones que SQLite ignora (p. ej. longitudes de VARCHAR).
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: mia
          POSTGRES_PASSWORD: mia
          POSTGRES_DB: mia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIA_TEST_DATABASE_URL: postgresql+asyncpg://mia:mia@localhost:5432/mia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migraciones sobre PostgreSQL
        run: MIA_DATABASE_URL=$MIA_TEST_DATABASE_URL alembic upgrade head && MIA_DATABASE_URL=$MIA_TEST_DATABASE_URL alembic downgrade base
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  imagen:
    needs: [calidad, postgres, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mia:${{ github.sha }} .
